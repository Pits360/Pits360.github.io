<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pits360 AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 20px; font-size: 24px; font-weight: bold; background: linear-gradient(45deg, #4285F4, #9B51E0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; border-bottom: 1px solid #2f2f30; text-align: center; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 16px; word-wrap: break-word; }
        .user { background-color: #282a2d; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background-color: #1e1f20; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2f2f30; }
        #input-container { padding: 20px; background-color: #131314; display: flex; gap: 10px; max-width: 800px; width: 100%; margin: 0 auto; }
        input { flex: 1; background-color: #1e1f20; border: 1px solid #3c4043; border-radius: 24px; padding: 14px 20px; color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #a8c7fa; }
        button { background-color: #a8c7fa; color: #042100; border: none; border-radius: 24px; padding: 0 24px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background-color: #c2e7ff; }
    </style>
</head>
<body>

    <header>Pits360 AI</header>

    <div id="chat-container">
        <div class="message ai">Cześć! Jestem Twoim asystentem Pits360 AI. Napisz coś poniżej, a chętnie porozmawiam i przeczytam odpowiedź na głos!</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Zapytaj Pits360 AI..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Wyślij</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        
        // 🔑 TUTAJ WKLEJ SWÓJ KLUCZ GEMINI (zostaw cudzysłowy!)
        const MY_GEMINI_API_KEY = "AQ.Ab8RN6KYnzEyRkhJsREcP7i4ZN_RV-kxZE9sCtx0Bh-dKfRC9A";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // Dodaj wiadomość użytkownika do czatu
            appendMessage(messageText, 'user');
            inputField.value = '';

            // Pokazywanie statusu "Myślenie..."
            const thinkingDiv = appendMessage('Pits360 myśli...', 'ai');

            try {
                // Wywołanie modelu Gemini 1.5 Flash
                const response = await fetch(`https://googleapis.com\${MY_GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: messageText }] }]
                    })
                });

                const data = await response.json();
                
                // Sprawdzenie czy API zwróciło poprawną odpowiedź
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    thinkingDiv.innerText = aiResponse;
                    speak(aiResponse); // Czytanie na głos
                } else {
                    thinkingDiv.innerText = "Błąd: Otrzymano nieprawidłowy format danych z API.";
                }

            } catch (error) {
                thinkingDiv.innerText = "Błąd: Nie udało się pobrać odpowiedzi. Upewnij się, że klucz API jest poprawny.";
                console.error(error);
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Zatrzymaj poprzednie zdanie
                
                // Usunięcie formatowania markdown (*, # itp.) przed czytaniem
                const cleanText = text.replace(/[*_#`\-]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'pl-PL'; // Ustawienie języka polskiego
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
